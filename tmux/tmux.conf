# ----------------------------------------------------------------
# https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
# ----------------------------------------------------------------

# Keybinds without prefix (-n)
# Ctrl-a -> split horizontally
bind -n C-a split-window -h
# Ctrl-s -> split vertically
bind -n C-s split-window -v
# Ctrl-t -> create new window 
bind -n C-t new-window
# Ctrl-Shift-x -> maximize/restore current pane
bind -n C-S-x resize-pane -Z
# Alt-arrow -> change pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Alt-r -> rename current window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Do not rename windows automatically
set-option -g allow-rename off

# Automatic renumbering when windows are closed 
set-option -g renumber-windows on

# Start pane and window indexes numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Change command-prompt bar (default is black on yellow)
set -g message-style "bg=#73daca,fg=#414868"
set -g message-command-style "bg=#73daca,fg=#414868"
# Alternative: dark, matches @tmux-dotbar-bg below
# set -g message-style "bg=#1a1b26,fg=#c0caf5"
# set -g message-command-style "bg=#1a1b26,fg=#c0caf5"

# Change copy-mode selection highlight (default is black on yellow)
set -g mode-style "bg=#28344a,fg=#a9b1d6"
# Search match highlight in copy-mode (also yellow by default)
set -g copy-mode-match-style "bg=#414868,fg=#c0caf5"
set -g copy-mode-current-match-style "bg=#73daca,fg=#414868"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Plugin for bottom status bar
# https://github.com/vaaleyard/tmux-dotbar
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-bg "#1a1b26"
set -g @tmux-dotbar-fg "#5a9b1d"
set -g @tmux-dotbar-bold-current-window true
set -g @tmux-dotbar-session-text " dotbar "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
