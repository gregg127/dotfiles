# https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# Keybinds without prefix (-n)
# Ctrl-a -> split horizontally
bind -n C-a split-window -h
# Ctrl-s -> split vertically
bind -n C-s split-window -v
# Ctrl-t -> create new window 
bind -n C-t new-window
# Ctrl-x -> maximize/restore current pane
bind -n C-x resize-pane -Z
# Alt-arrow -> change pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Alt-r -> rename current window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Do not rename windows automatically
set-option -g allow-rename off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Plugin for bottom status bar
set -g @plugin 'vaaleyard/tmux-dotbar'

# Dotbar plugin configration
# set -g @tmux-dotbar-position top
set -g @tmux-dotbar-bg "#1a1b26"
set -g @tmux-dotbar-fg "#5a9b1d"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
